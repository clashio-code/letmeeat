           else if(move&&down)build_motion(2/*ACTION_MOVE*/,x,y);
           else if(!down&&!move)build_motion(1/*ACTION_UP*/,x,y);
           else return;
           ((int(*)(void*,void*,void*))n->fn)(&g_envobj,g_unity_self,motion_obj);
           g_injected++;
