      - name: Kompilasi (armhf)
        run: |
          arm-linux-gnueabihf-gcc -std=gnu11 -O2 -Wall -Wextra -Wno-unused-parameter -o out/letmeeat/letmeeatloader src/letmeeatloader.c -Isrc -ldl -lpthread -lm
          file out/letmeeat/letmeeatloader || true
          arm-linux-gnueabihf-readelf -d out/letmeeat/letmeeatloader | grep NEEDED
          MAXV=$(arm-linux-gnueabihf-readelf -V out/letmeeat/letmeeatloader | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -1)
          echo "butuh GLIBC tertinggi: $MAXV (device armhf: 2.37)"
          if [ "$(printf '%s\n%s\n' 2.37 "$MAXV" | sort -V | tail -1)" != "2.37" ]; then
            echo "GAGAL: butuh glibc lebih baru dari 2.37. Simbol penyebab:"
            arm-linux-gnueabihf-nm -D --undefined-only out/letmeeat/letmeeatloader | grep -E 'GLIBC_2\.(3[89]|[4-9][0-9])' || true
            exit 1
          fi
      - name: Siapkan paket
        run: |
          cat > out/letmeeat/LetMeEatM2.sh <<'EOF_SH'
          #!/bin/bash
          # Let Me Eat M2 loader (armhf): shim bionic + SDL2/EGL bridge + boot Unity + render loop.
          XDG_DATA_HOME=${XDG_DATA_HOME:-$HOME/.local/share}
          if [ -d "/opt/system/Tools/PortMaster/" ]; then controlfolder="/opt/system/Tools/PortMaster"
          elif [ -d "/opt/tools/PortMaster/" ]; then controlfolder="/opt/tools/PortMaster"
          elif [ -d "$XDG_DATA_HOME/PortMaster/" ]; then controlfolder="$XDG_DATA_HOME/PortMaster"
          else controlfolder="/roms/ports/PortMaster"; fi
          [ -f "$controlfolder/control.txt" ] && source "$controlfolder/control.txt"
          [ -f "${controlfolder}/mod_${CFW_NAME}.txt" ] && source "${controlfolder}/mod_${CFW_NAME}.txt"
          HERE="$(cd "$(dirname "$0")" && pwd)"
          GAMEDIR=""
          for c in "/$directory/ports/letmeeat" "/$directory/ports/LetMeEat" "$HERE/letmeeat" "$HERE/LetMeEat" \
                   /mnt/sdcard/ports/LetMeEat /mnt/sdcard/ports/letmeeat /mnt/mmc/ports/LetMeEat /mnt/mmc/ports/letmeeat; do
            if [ -f "$c/letmeeatloader" ]; then GAMEDIR="$c"; break; fi
          done
          if [ -z "$GAMEDIR" ]; then
            echo "letmeeatloader tidak ketemu. Salin isi folder build ke folder game (mis. /mnt/sdcard/ports/LetMeEat)." > "$HERE/letmeeat_error.txt"
            sleep 3; exit 1
          fi
          cd "$GAMEDIR" || exit 1
          LIBDIR="lib/armeabi-v7a"
          [ -f libs/libunity.so ] && LIBDIR="libs"
          ASSETDIR="assets"
          [ -d "$ASSETDIR" ] || ASSETDIR="."
          export LD_LIBRARY_PATH="/usr/lib32:/lib32:${LD_LIBRARY_PATH}"
          chmod +x ./letmeeatloader 2>/dev/null
          rm -f m2_log.txt m1_log.txt
          echo "GAMEDIR=$GAMEDIR libdir=$LIBDIR assets=$ASSETDIR" > m2_stdout.txt
          if [ ! -f "$LIBDIR/libunity.so" ] || [ ! -f "$LIBDIR/libil2cpp.so" ] || [ ! -f "$LIBDIR/libmain.so" ]; then
            echo "libmain.so/libunity.so/libil2cpp.so tidak ada di $GAMEDIR/$LIBDIR" >> m2_stdout.txt
            sleep 3; exit 1
          fi
          TMO=""; command -v timeout >/dev/null 2>&1 && TMO="timeout -k 5 300"
          $TMO ./letmeeatloader --ui --stage 3 --frames 12000 --fps 30 --libdir "$LIBDIR" --assets "$ASSETDIR" --timeout 180 --log m2_log.txt >> m2_stdout.txt 2>&1
          echo "exit code: $?" >> m2_stdout.txt
          sleep 3
          type pm_finish >/dev/null 2>&1 && pm_finish
          EOF_SH
          chmod +x out/letmeeat/LetMeEatM2.sh
          sed -e 's#--ui --stage 3#--uidrop --stage 3#' -e 's#m2_log.txt#m2_log_uidrop.txt#g' -e 's#m2_stdout.txt#m2_stdout_uidrop.txt#g' out/letmeeat/LetMeEatM2.sh > out/letmeeat/LetMeEatM2_uidrop.sh
          sed -e 's#--ui --stage 3#--uiptr1 --stage 3#' -e 's#m2_log.txt#m2_log_ptrodd.txt#g' -e 's#m2_stdout.txt#m2_stdout_ptrodd.txt#g' out/letmeeat/LetMeEatM2.sh > out/letmeeat/LetMeEatM2_ptrodd.sh
          chmod +x out/letmeeat/LetMeEatM2_ptrodd.sh
          chmod +x out/letmeeat/LetMeEatM2_uidrop.sh
          cat > out/letmeeat/BACA-DULU.txt <<'EOF_TXT'
          Let Me Eat M2 (port Let Me Eat / Unity 6000.0 IL2CPP armeabi-v7a -> Linux armhf / muOS)
          
          YANG BARU DI M2:
          - Jendela SDL2 + jembatan EGL hibrida (Unity memakai konteks/surface EGL milik SDL).
          - Boot Unity: initJni -> nativeRecreateGfxState -> nativeResume -> loop nativeRender.
          - Input: stick/D-pad/kursor virtual -> MotionEvent -> nativeInjectEvent.
          - Exit: Select+Start (pad) atau ESC (keyboard).
          
          CATATAN PENTING (M2 masih eksperimental):
          - Layar hitam selama boot itu NORMAL di M2. Unity butuh waktu memuat asset dulu,
            lalu nativeRender mulai jalan. Tunggu sampai baris "detak ... nativeRender=NN"
            muncul di log.
          - Ada watchdog otomatis: kalau nativeRender tidak jalan selama 120 detik, atau
            macet tanpa progres setengah dari --timeout, proses berhenti sendiri. Jadi tidak
            perlu khawatir hang selamanya.
          - Kalau sudah keluar baris "MACET!" atau "STALL", artinya Unity menunggu callback
            Choreographer/Looper. Kirim log-nya ke Claude.

          CATATAN FIX25:
          - Run fix24 mati di DETIK KE-3 sebelum kode proxy fix24 sempat jalan: thread heartbeat (hb_threads/hb_stack) SIGSEGV saat memindai stack
            thread lain, membaca halaman penjaga (si_addr=d8eec000 '---p'). Penyebab: probe memori lama memakai write(/dev/null), yang TIDAK memeriksa
            apakah halaman termap (kernel tak menyentuh buffer). Run fix23 hanya beruntung. Itu bug diagnostik loader, bukan bug game.
          - fix25: semua probe (bt_ok/bt_is_call/mem_peek/code_dump/safe_rd) kini memakai process_vm_readv(getpid) -> EFAULT bila tak termap;
            fallback pipe tanpa mutex bila syscall tidak ada di kernel 4.9 ini. Logika proxy fix24 tidak diubah.

          CATATAN FIX24:
          - Disassembly nativeProxyInvoke (libunity+0x20d0ec): delegate==0 -> target=0; delegate GANJIL -> target=gchandle_get_target(delegate);
            delegate GENAP -> target=*delegate (delegate = ALAMAT SEL berisi objek managed). Target lalu dipakai sebagai 'this' untuk invoke IL2CPP.
          - ptr dari newInterfaceProxy = objek C++ 16 byte {vptr, vptr2, objek-managed, gchandle=9}; *ptr = vtable -> dipakai sbg 'this' -> SIGBUS di il2cpp+0x2387cb4.
          - fix24: pindai ptr..ptr+0x1c cari kata yang menunjuk objek managed valid (klass->name terbaca & printable), pakai alamat sel itu sbg delegate
            (kemungkinan ptr+8). Kalau tidak ada: coba GC handle di ptr+0xc; kalau tetap tidak ada: job dilewati (tanpa crash). Log: "[ui] kandidat ...", "[ui] delegate dipakai".
          - Pembacaan memori memakai pipe (EFAULT-aman), bukan write(/dev/null). --uiold = perilaku lama (ptr apa adanya).
          - Semua RegisterNatives pada class tak bernama (obj:...) sekarang dicatat "[nat]" (untuk mengenali Class#5).
          - Jalankan LetMeEatM2.sh, kirim m2_log.txt + m2_stdout.txt.

          CATATAN FIX23:
          - fix22 menghentikan SIGBUS, tapi log-nya MEMBANTAH teori "objek dibebaskan": vtable di ptr berubah
            dengan pasangan yang SAMA (f..4d10 -> f..4b88) untuk dua objek berbeda, termasuk objek yang baru
            dibuat satu frame sebelumnya. Itu pola konstruktor C++ (vtable basis -> vtable turunan), bukan memori basi.
          - Membuang job malah bikin Unity macet di frame 187 (menunggu hasil job UI).
          - fix23: job TIDAK dibuang lagi (hanya dicatat), dan crash handler mendump kode rantai pemanggil
            (nativeProxyInvoke, libunity+0x3a65c7, il2cpp+0x99d6dc/0x99d7f8/0x891690) + 24 kata di ptr, ptr+0x20, ptr+0x40.
          - Jalankan LetMeEatM2.sh dan kirim m2_log.txt + m2_stdout.txt.

          CATATAN FIX22:
          - diag18 membuktikan isi ptr Runnable berubah sejak dibuat (objek dibebaskan/dipakai ulang) -> SIGBUS.
          - fix22: simpan kata pertama (vtable) ptr saat proxy dibuat; saat job akan dijalankan dibandingkan lagi.
            Kalau beda -> "[ui] job basi dibuang" (tidak dijalankan, tidak crash). Job yang masih sah tetap jalan.
          - Jalankan LetMeEatM2.sh dan kirim m2_log.txt + m2_stdout.txt. Cari baris "job basi dibuang".

          CATATAN DIAG18:
          - diag17: ptr|1 (LetMeEatM2_ptrodd.sh) menghilangkan SIGBUS, tapi Runnable berujung di
            ReflectionHelper.createInvocationError (jalur error) dan game tetap macet di frame 185 sesudah
            Handler.obtainMessage(I).sendToTarget(). Fungsi libunity+0x3ab25c = stub PLT ke API IL2CPP
            (kemungkinan il2cpp_gchandle_get_target) -> ptr|1 dibaca sebagai GCHandle (salah).
          - Native ReflectionHelper terdaftar: nativeProxyInvoke, nativeProxyFinalize,
            nativeProxyLogJNIInvokeException, nativeProxyJNIFreeGCHandle.
          - diag18: catat isi memori ptr SAAT proxy DIBUAT ("ptr@dibuat") dan saat dipanggil, plus
            alamat pemanggil newInterfaceProxy di libunity dan dump kode pembuatnya ("creator-...").
            Tujuan: cek apakah isi ptr berubah (memori dipakai ulang) atau memang objek C++ sejak awal.
          - Jalankan LetMeEatM2.sh dan kirim m2_log.txt + m2_stdout.txt.

          CARA PASANG:
          1. Salin isi folder ini ke folder game di Anbernic, mis. /mnt/sdcard/ports/LetMeEat/
             (sebelah folder lib/ dan assets/ hasil ekstrak APK).
          2. Pastikan struktur game ada:
             lib/armeabi-v7a/{libmain.so,libunity.so,libil2cpp.so}
             assets/bin/Data/{data.unity3d,resources.resource,boot.config,...}
          3. Jalankan LetMeEatM2.sh dari menu Ports muOS.
          4. Kirim m2_log.txt + m2_stdout.txt ke Claude untuk analisa.
          5. M2 membersihkan cache data/il2cpp dan save/il2cpp saat mulai, agar cache metadata/resources yang terpotong dari run sebelumnya tidak dipakai.
          
          JANGAN upload lib/ atau APK game ke GitHub.
          EOF_TXT
      - name: Unggah hasil build
        uses: actions/upload-artifact@v4
        with:
          name: letmeeat-m2-armhf
          path: out
