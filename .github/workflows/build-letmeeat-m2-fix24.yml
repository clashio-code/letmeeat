          static void L(const char *fmt,...){va_list a;va_start(a,fmt);vfprintf(stdout,fmt,a);va_end(a);fflush(stdout);if(g_log){va_start(a,fmt);vfprintf(g_log,fmt,a);va_end(a);fflush(g_log);}}
