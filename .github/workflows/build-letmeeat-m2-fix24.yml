          static void crc_init(void){uint32_t i,j,c;for(i=0;i<256;i++){c=i;for(j=0;j<8;j++)c=(c&1)?(0xEDB88320u^(c>>1)):(c>>1);crc_tab[i]=c;}crc_ok=1;}
