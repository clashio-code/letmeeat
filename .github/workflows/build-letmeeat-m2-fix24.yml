          static uint64_t touch_down_time;
          static void build_motion(int action,float x,float y){
           /* State sentuhan dicatat di satu struct global; Unity membacanya lewat getter JNI
              (getAction/getX/getY) pada objek MotionEvent palsu ini. */
           g_mev.action=action;g_mev.x=x;g_mev.y=y;g_mev.seq=++touch_seq;g_mev.tool=1;g_mev.id=0;
           g_mev.when=(uint64_t)time(NULL)*1000000ull+(uint64_t)(g_mev.seq%1000000);
           if(action==0)g_mev.down=g_mev.when;
           g_mev.pres=1.f;g_mev.area=0.f;g_mev.state=0;g_mev.precision=1.f;
           g_have_mev=1;
          }
          static void send_touch(int down,float x,float y,int move){
           Native*n=find_native("UnityPlayer","nativeInjectEvent");if(!n||!g_m2_ready||!g_unity_self)return;
           if(!motion_obj)motion_obj=mk_obj("android/view/MotionEvent");
           if(!touch_seq)touch_seq=1;
           if(down&&!move)build_motion(0/*ACTION_DOWN*/,x,y);
           else if(move&&down)build_motion(2/*ACTION_MOVE*/,x,y);
           else if(!down&&!move)build_motion(1/*ACTION_UP*/,x,y);
           else return;
           ((int(*)(void*,void*,void*))n->fn)(&g_envobj,g_unity_self,motion_obj);
           g_injected++;
           if(g_injected<=5||g_injected%120==0)L("[input] inject %s @%.0f,%.0f seq=%d total=%d\n",move?"MOVE":down?"DOWN":"UP",x,y,touch_seq,g_injected);
          }
